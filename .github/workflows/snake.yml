# Redraws the contribution-graph snake every day and publishes it to the
# `output` branch, where README.md picks it up.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161b22,#3b1d5e,#6b2fa8,#9b4de8,#E879F9
            dist/snake-light.svg?color_snake=#A855F7&color_dots=#ebedf0,#e9d5ff,#d8b4fe,#c084fc,#A855F7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
