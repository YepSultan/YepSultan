# Redraws the contribution-graph snake every day and publishes it to the
# `output` branch, where README.md picks it up.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B35&color_dots=#161b22,#4a1f0f,#8a3517,#d4521f,#FFB061
            dist/snake-light.svg?color_snake=#FF6B35&color_dots=#ebedf0,#ffd6c2,#ffac85,#ff8047,#FF6B35

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
